name: Verify

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-boundaries:
    name: Build and dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test reactor
        run: mvn -B clean verify

      - name: Check dependency boundaries
        run: bash scripts/check-dependency-boundaries.sh

  spring-boot-compatibility:
    name: Spring Boot ${{ matrix.spring-boot-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot-version:
          - "3.2.0"
          - "3.5.9"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test Spring Boot compatibility
        env:
          BOOT_COMPATIBILITY_VERSIONS: ${{ matrix.spring-boot-version }}
        run: bash scripts/check-spring-boot-compatibility.sh
